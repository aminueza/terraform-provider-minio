# Dependabot Configuration
version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    reviewers:
      - "aminueza"
    commit-message:
      prefix: "ci(deps):"
    open-pull-requests-limit: 10

  # Enable version updates for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    reviewers:
      - "aminueza"
    commit-message:
      prefix: "deps:"
    open-pull-requests-limit: 10

  # Enable version updates for Docker Compose images
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    reviewers:
      - "aminueza"
    commit-message:
      prefix: "docker(deps):"
    open-pull-requests-limit: 5
    ignore:
      # The golang image in docker-compose.yml is generated from the toolchain
      # directive in go.mod by .github/workflows/update-go-toolchain.yml, which
      # rewrites that line every Monday. Managing it here as well means the two
      # take turns overwriting each other.
      - dependency-name: "golang"
