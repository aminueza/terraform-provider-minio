name: AIStor ILM Test

# all_versions_expiration on minio_ilm_policy maps the AllVersionsExpiration
# lifecycle action, which only MinIO AIStor accepts, so its acceptance test
# needs an AIStor server (issue #1259). The image pulls anonymously, but the
# server denies every S3 request until it is given a license. The license comes
# from the AISTOR_LICENSE secret; without it the job is skipped with a notice,
# so fork pull requests, which cannot read secrets, always take that path.
on:
  pull_request:
    branches: [main]
    paths:
      - "minio/resource_minio_ilm_policy*.go"
      - "go.mod"
      - ".github/workflows/aistor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-versions-expiration:
    name: AIStor (all_versions_expiration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # An explicit bash adds pipefail, so a failing `go test | tee` fails the step.
    defaults:
      run:
        shell: bash
    env:
      # Dependabot does not update an image named here; bump the tag by hand.
      AISTOR_IMAGE: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    steps:
      - name: Check that the license is configured
        id: gate
        env:
          AISTOR_LICENSE: ${{ secrets.AISTOR_LICENSE }}
        run: |
          if [ -z "$AISTOR_LICENSE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AIStor ILM test skipped: secret not configured: AISTOR_LICENSE"
            exit 0
          fi
          umask 077
          printf '%s' "$AISTOR_LICENSE" > "$RUNNER_TEMP/minio.license"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Check out the repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - name: Set up Go
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Start AIStor
        if: steps.gate.outputs.run == 'true'
        run: |
          docker run -d --name aistor -p 9000:9000 \
            -v "$RUNNER_TEMP/minio.license:/minio.license:ro" \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio123 \
            "$AISTOR_IMAGE" minio server /data --license /minio.license
          # Without a valid license AIStor stays live but never ready.
          if ! timeout 120 bash -c 'until curl -sf http://localhost:9000/minio/health/ready; do sleep 2; done'; then
            echo "::error::AIStor did not become ready; check that AISTOR_LICENSE holds a valid license"
            exit 1
          fi

      - name: Run TestAccILMPolicy_allVersionsExpiration
        if: steps.gate.outputs.run == 'true'
        env:
          TF_ACC: "1"
          TF_ACC_TERRAFORM_VERSION: "1.11.4"
          MINIO_AISTOR: "1"
          MINIO_ENDPOINT: localhost:9000
          MINIO_USER: minio
          MINIO_PASSWORD: minio123
          MINIO_ENABLE_HTTPS: "false"
        run: |
          # testAccPreCheck requires the variables of all four instances; this
          # test only uses the primary one.
          for prefix in SECOND THIRD FOURTH; do
            export "${prefix}_MINIO_ENDPOINT=$MINIO_ENDPOINT" "${prefix}_MINIO_USER=$MINIO_USER" \
              "${prefix}_MINIO_PASSWORD=$MINIO_PASSWORD" "${prefix}_MINIO_ENABLE_HTTPS=$MINIO_ENABLE_HTTPS"
          done
          go test -v -count=1 -timeout 15m ./minio -run '^TestAccILMPolicy_allVersionsExpiration$' | tee go-test.log
          # A skipped test exits 0, so require the PASS line.
          if ! grep -q '^--- PASS: TestAccILMPolicy_allVersionsExpiration ' go-test.log; then
            echo "::error::TestAccILMPolicy_allVersionsExpiration did not run"
            exit 1
          fi

      - name: Show the AIStor logs
        if: failure() && steps.gate.outputs.run == 'true'
        run: docker logs aistor
