name: Hosted S3 Backends

# Runs the S3 acceptance subset against the hosted services the README names.
# They need accounts and cost money, so this never runs on pull_request: a fork
# cannot read the secrets, and every outside contributor would see it fail.
on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Backend to run, or all of them"
        type: choice
        default: all
        options: [all, r2, b2, spaces, hetzner]
  schedule:
    - cron: "0 7 * * 1" # Monday 7am UTC, an hour after the latest-MinIO run

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  hosted:
    name: ${{ matrix.name }} (S3 subset)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: r2
            name: Cloudflare R2
            secret: R2
          - backend: b2
            name: Backblaze B2
            secret: B2
          - backend: spaces
            name: DigitalOcean Spaces
            secret: SPACES
          - backend: hetzner
            name: Hetzner Object Storage
            secret: HETZNER
    env:
      TF_ACC: "1"
      TF_ACC_TERRAFORM_VERSION: "1.11.4"
      MINIO_ENDPOINT: ${{ secrets[format('{0}_S3_ENDPOINT', matrix.secret)] }}
      MINIO_REGION: ${{ secrets[format('{0}_S3_REGION', matrix.secret)] }}
      MINIO_USER: ${{ secrets[format('{0}_S3_ACCESS_KEY', matrix.secret)] }}
      MINIO_PASSWORD: ${{ secrets[format('{0}_S3_SECRET_KEY', matrix.secret)] }}
      MINIO_ENABLE_HTTPS: "true"
      MINIO_S3_COMPAT_MODE: "true"
      MADMIN_API_VERSION: "v3"
    steps:
      - name: Decide whether this backend runs
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.backend }}" != "all" ] \
             && [ "${{ inputs.backend }}" != "${{ matrix.backend }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.name }} not selected in this dispatch."
            exit 0
          fi
          missing=""
          [ -n "$MINIO_ENDPOINT" ] || missing="$missing ${{ matrix.secret }}_S3_ENDPOINT"
          [ -n "$MINIO_REGION" ] || missing="$missing ${{ matrix.secret }}_S3_REGION"
          [ -n "$MINIO_USER" ] || missing="$missing ${{ matrix.secret }}_S3_ACCESS_KEY"
          [ -n "$MINIO_PASSWORD" ] || missing="$missing ${{ matrix.secret }}_S3_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.name }} skipped: secrets not configured:$missing"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out the repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - name: Set up Go
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run the S3 subset
        if: steps.gate.outputs.run == 'true'
        run: |
          # The hosted services are reached by every provider alias the tests
          # declare, so the replication fixtures resolve; their tests are in the
          # unsupported record of every hosted backend.
          for prefix in SECOND THIRD FOURTH; do
            export "${prefix}_MINIO_ENDPOINT=$MINIO_ENDPOINT" "${prefix}_MINIO_REGION=$MINIO_REGION" \
              "${prefix}_MINIO_USER=$MINIO_USER" "${prefix}_MINIO_PASSWORD=$MINIO_PASSWORD" \
              "${prefix}_MINIO_ENABLE_HTTPS=true" "${prefix}_MINIO_S3_COMPAT_MODE=true"
          done

          TEST_PATTERN="$(jq -r --arg b "${{ matrix.backend }}" '.backends[$b].run' testdata/multi-backend/support.json)"
          TEST_SKIP="$(.github/scripts/backend-skip.sh "${{ matrix.backend }}")"
          MATCH_COUNT=$(go test -list "$TEST_PATTERN" ./minio | grep -c "^TestAcc" || true)
          if [ "$MATCH_COUNT" -eq 0 ]; then
            echo "::error::TEST_PATTERN '$TEST_PATTERN' matches zero tests"
            exit 1
          fi
          echo "Pattern matches $MATCH_COUNT test(s); skip list has $(echo "$TEST_SKIP" | tr '|' '\n' | grep -c . || true) group(s)"

          # No -failfast: the point of the run is the full map of what works.
          set +e
          go test -json -timeout 50m ./minio -run "$TEST_PATTERN" ${TEST_SKIP:+-skip "$TEST_SKIP"} > go-test.json
          status=$?
          set -e
          python3 .github/scripts/backend-report.py "${{ matrix.backend }}" testdata/multi-backend/support.json go-test.json >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Remove the buckets this run created
        if: always() && steps.gate.outputs.run == 'true'
        run: go run ./tools/hosted-cleanup -since "${{ steps.gate.outputs.started }}"
